name: Create Linglong Store Installer Release
run-name: ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      go_version:
        description: Go toolchain version (should match go.mod toolchain)
        required: true
        default: "1.24.11"
      release_tag:
        description: Tag name for GitHub Release (e.g. v1.2.3)
        required: true
      create_release:
        description: Create GitHub Release after successful build
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:10
    
    steps:
      - name: Fix Debian 10 apt sources (EOL)
        run: |
          set -eux
          sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git ca-certificates curl wget patch zip unzip \
            build-essential \
            libx11-dev libxext-dev libxrender-dev libxft-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Install Go
        run: |
          curl -fsSL https://go.dev/dl/go${{ inputs.go_version }}.linux-amd64.tar.gz -o go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace for git (safe.directory)
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain=v1 || true

      - name: Generate Release Notes
        if: ${{ inputs.create_release == 'true' }}
        run: |
          set -eu

          current_tag="${{ inputs.release_tag }}"
          if printf '%s\n' "$current_tag" | grep -q '^v'; then
            tag_pattern='v*'
          else
            tag_pattern='[0-9]*'
          fi

          previous_tag="$(git tag --list "$tag_pattern" --sort=-version:refname | grep -Fxv "$current_tag" | head -n 1 || true)"

          {
            echo "## Changes"
            echo
            echo "Release tag: \`${current_tag}\`"
            echo "Commit: \`$(git rev-parse --short "$GITHUB_SHA")\`"
            echo

            if [ -n "$previous_tag" ]; then
              echo "Based on commits since \`${previous_tag}\`:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous_tag}..${GITHUB_SHA}" || true
            else
              echo "Recent commits:"
              echo
              git log --no-merges --pretty='- %s (%h)' -n 20 "${GITHUB_SHA}" || true
            fi
          } > release-notes.md

          if ! grep -q '^- ' release-notes.md; then
            echo "- Release commit: $(git rev-parse --short "$GITHUB_SHA")" >> release-notes.md
          fi

      - name: Build for amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: "-mod=vendor"
        run: |
          set -eux
          go version
          go env
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -o linglong-store-installer-amd64 -ldflags="-X main.version=${{ inputs.release_tag }} -X main.buildTime=${BUILD_TIME}" .

      - name: Build for arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOFLAGS: "-mod=vendor"
        run: |
          set -eux
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -o linglong-store-installer-arm64 -ldflags="-X main.version=${{ inputs.release_tag }} -X main.buildTime=${BUILD_TIME}" .

      - name: Upload amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linglong-store-installer-amd64
          path: linglong-store-installer-amd64
          retention-days: 30

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linglong-store-installer-arm64
          path: linglong-store-installer-arm64
          retention-days: 30

      - name: Create Release
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            linglong-store-installer-amd64
            linglong-store-installer-arm64
            linglong-store-installer.sh

  sync-gitee:
    if: ${{ inputs.create_release == 'true' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate Gitee sync configuration
        env:
          GITEE_PUSH_URL: ${{ secrets.GITEE_PUSH_URL }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -eu

          missing=0

          for var_name in GITEE_PUSH_URL GITEE_REPO GITEE_TOKEN; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::Missing required GitHub Actions ${var_name#GITEE_} configuration for Gitee sync: ${var_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch and tag to Gitee
        env:
          GITEE_PUSH_URL: ${{ secrets.GITEE_PUSH_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove gitee || true
          git remote add gitee "$GITEE_PUSH_URL"

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push gitee "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push gitee "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Wait for GitHub Release visibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu

          for attempt in $(seq 1 12); do
            status_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"

            if [ "$status_code" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "::error::GitHub Release ${RELEASE_TAG} was not visible after waiting"
          cat /tmp/release.json || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync GitHub Release to Gitee Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          TARGET_TAG: ${{ inputs.release_tag }}
        run: |
          set -eux
          node tools/github2gitee/github2gitee.js
